services:
  ### Algorithex's Workspace ################################################
  algorithex:
    image: algorithex:latest
    build:
      context: ../../algorithex
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    tty: true
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      # MCP Server Port
      - "9002:9002"
      # Jupyter Port
      - "8888:8888"
      # LSP Port
      - "9001:9001"
    volumes:
      - ../:/home
    container_name: algorithex
    command: bash -c "algorithex install-live --no-strict && algorithex run"

  ### PostgreSQL ################################################
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=algorithex_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=algorithex_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: postgres

  ### Redis ################################################
  redis:
    image: redis:6-alpine
    container_name: redis
    command: redis-server --save "" --appendonly no
    
volumes:
  postgres-data:
